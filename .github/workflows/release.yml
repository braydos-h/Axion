name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a tag like v1.2.3' >&2; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }
  checks:
    needs: verify-tag
    uses: ./.github/workflows/rust.yml
  binaries:
    needs: verify-tag
    uses: ./.github/workflows/build.yml
  publish:
    needs: [checks, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: axion-linux-*
          merge-multiple: true
          path: dist
      - name: Verify both archives and generate checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          test -f "axion-${TAG}-linux-x86_64.tar.gz"
          test -f "axion-${TAG}-linux-aarch64.tar.gz"
          sha256sum "axion-${TAG}-linux-x86_64.tar.gz" "axion-${TAG}-linux-aarch64.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Smoke test x86_64 release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf "dist/axion-${TAG}-linux-x86_64.tar.gz" -C smoke
          test -x smoke/axion
          smoke/axion --version
          smoke/axion config example >/dev/null
          test -f smoke/config/axion.example.toml
          test -f smoke/docs/DETECTION.md
          test -f smoke/packaging/axion.service
      - name: Verify asset architecture metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p archcheck
          tar -xzf "dist/axion-${TAG}-linux-aarch64.tar.gz" -C archcheck
          file archcheck/axion
      - name: Create draft, verify all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --draft --verify-tag --generate-notes dist/*.tar.gz dist/SHA256SUMS
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/axion-assets
          printf '%s\n' SHA256SUMS "axion-${TAG}-linux-aarch64.tar.gz" "axion-${TAG}-linux-x86_64.tar.gz" | sort > /tmp/axion-expected
          diff -u /tmp/axion-expected /tmp/axion-assets
          gh release edit "$TAG" --draft=false
