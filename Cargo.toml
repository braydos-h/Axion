[package]
name = "axion"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Axion: a Rust-native deep packet inspection and network enforcement engine"
repository = "https://github.com/braydos-h/Axion"
readme = "README.md"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0"
arc-swap = "1.7"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-channel = "0.5"
dashmap = "6.1"
hkdf = "0.12"
ipnet = "2.11"
libc = "0.2"
libloading = "0.8"
md-5 = "0.10"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bench]]
name = "packet"
harness = false

[[bench]]
name = "reassembly"
harness = false
