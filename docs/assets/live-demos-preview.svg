<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Axion Live Demos dashboard preview</title>
  <desc id="desc">Illustrative preview of the embedded Axion Live Demos view, including scenario cards, playback controls, live charts, flows and detection events.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.55" stop-color="#081420"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102230"/>
      <stop offset="1" stop-color="#0c1823"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d0d8" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#39d0d8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0d8"/>
      <stop offset="1" stop-color="#7ef29a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, 'Segoe UI', system-ui, sans-serif; fill: #e7f1f7; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
      .muted { fill: #7f9aab; }
      .teal { fill: #39d0d8; }
      .green { fill: #7ef29a; }
      .warn { fill: #ffcc66; }
      .danger { fill: #ff6b6b; }
      .h { font-weight: 700; letter-spacing: 0.02em; }
      .caps { font-size: 10px; font-weight: 700; letter-spacing: 2px; fill: #7f9aab; }
      .cardrect { fill: url(#panel); stroke: #1d3546; stroke-width: 1; }
      .pill { fill: #102230; stroke: #1d3546; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="1090" cy="20" r="300" fill="#39d0d8" opacity="0.06"/>
  <circle cx="90" cy="400" r="260" fill="#7ef29a" opacity="0.035"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1280" height="72" fill="#071019" opacity="0.92"/>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#1d3546"/>
  <rect x="28" y="16" width="42" height="42" rx="10" fill="#0d1a26" stroke="#39d0d8"/>
  <text x="49" y="44" text-anchor="middle" font-size="21" font-weight="800" fill="#39d0d8">A</text>
  <text x="84" y="34" font-size="18" font-weight="800" letter-spacing="4">AXION</text>
  <text x="84" y="52" font-size="11" class="muted">Rust-native deep packet inspection</text>
  <rect x="455" y="18" width="334" height="37" rx="9" fill="#0d1a26" stroke="#1d3546"/>
  <text x="535" y="42" text-anchor="middle" font-size="12" class="muted">Operations</text>
  <rect x="636" y="23" width="142" height="27" rx="7" fill="#39d0d8" opacity="0.1"/>
  <text x="707" y="42" text-anchor="middle" font-size="12" class="teal">Live Demos •</text>
  <circle cx="1074" cy="37" r="5" fill="#7ef29a"/>
  <rect x="1090" y="25" width="68" height="24" rx="12" fill="#0d1a26" stroke="#7ef29a" opacity="0.8"/>
  <text x="1124" y="41" text-anchor="middle" font-size="10" class="green mono">DEMO</text>
  <text x="1174" y="41" font-size="11" class="muted mono">v0.1.0</text>

  <!-- demo ribbon -->
  <rect x="28" y="91" width="1224" height="42" rx="9" fill="#2b250f" stroke="#ffcc66" opacity="0.42"/>
  <rect x="42" y="103" width="78" height="18" rx="4" fill="#ffcc66"/>
  <text x="81" y="116" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1.4" fill="#201704">DEMO DATA</text>
  <text x="132" y="116" font-size="11" fill="#efd9a7">Every figure below is produced by replaying embedded deterministic pcap fixtures through a private Axion engine. This is not live network traffic.</text>
  <text x="1237" y="116" text-anchor="end" font-size="10" class="muted">Public demo mode: production controls disabled</text>

  <!-- header -->
  <text x="30" y="172" font-size="9" class="mono teal" letter-spacing="2">INTERACTIVE LABORATORY</text>
  <text x="30" y="207" font-size="32" font-weight="700">Live demos</text>
  <text x="30" y="229" font-size="11" class="muted">Select a scenario and watch real parsing, DPI classification, confidence scoring and rule evaluation update as packets replay.</text>
  <rect x="872" y="180" width="88" height="22" rx="11" class="pill"/>
  <text x="916" y="195" text-anchor="middle" font-size="9" class="green">no root</text>
  <rect x="968" y="180" width="94" height="22" rx="11" class="pill"/>
  <text x="1015" y="195" text-anchor="middle" font-size="9" class="green">no capture</text>
  <rect x="1070" y="180" width="88" height="22" rx="11" class="pill"/>
  <text x="1114" y="195" text-anchor="middle" font-size="9" class="green">no NFQUEUE</text>
  <rect x="1166" y="180" width="86" height="22" rx="11" class="pill"/>
  <text x="1209" y="195" text-anchor="middle" font-size="9" class="green">isolated</text>

  <!-- scenario cards -->
  <rect x="28" y="255" width="1224" height="158" rx="12" class="cardrect"/>
  <text x="46" y="280" font-size="11" font-weight="700" letter-spacing="1.2" fill="#b9d1de">CHOOSE A DEMONSTRATION</text>
  <text x="1234" y="280" text-anchor="end" font-size="10" class="muted mono">7 scenarios · max 4 sessions</text>
  <g>
    <rect x="46" y="295" width="286" height="98" rx="9" fill="#0d1a26" stroke="#39d0d8"/>
    <text x="60" y="327" font-size="20" class="mono teal">01</text>
    <text x="94" y="318" font-size="12" font-weight="600">Normal HTTPS Traffic</text>
    <text x="94" y="336" font-size="9" class="muted">TLS is ordinary traffic, not a verdict</text>
    <text x="94" y="369" font-size="9" class="mono" fill="#7291a5">1 fixture · classification</text>
  </g>
  <g>
    <rect x="344" y="295" width="286" height="98" rx="9" fill="#0d1a26" stroke="#1d3546"/>
    <text x="358" y="327" font-size="20" class="mono teal">02</text>
    <text x="392" y="318" font-size="12" font-weight="600">SOCKS5 Proxy Detection</text>
    <text x="392" y="336" font-size="9" class="muted">Complete plaintext request is direct evidence</text>
    <text x="392" y="369" font-size="9" class="mono" fill="#7291a5">1 fixture · classification</text>
  </g>
  <g>
    <rect x="642" y="295" width="286" height="98" rx="9" fill="#0d1a26" stroke="#1d3546"/>
    <text x="656" y="327" font-size="20" class="mono teal">03</text>
    <text x="690" y="318" font-size="12" font-weight="600">HTTP CONNECT Detection</text>
    <text x="690" y="336" font-size="9" class="muted">CONNECT exposes a proxy tunnel handshake</text>
    <text x="690" y="369" font-size="9" class="mono" fill="#7291a5">1 fixture · classification</text>
  </g>
  <g>
    <rect x="940" y="295" width="312" height="98" rx="9" fill="#0d1a26" stroke="#1d3546"/>
    <text x="954" y="327" font-size="20" class="mono teal">04</text>
    <text x="988" y="318" font-size="12" font-weight="600">VLESS and Trojan Detection</text>
    <text x="988" y="336" font-size="9" class="muted">Plaintext fallback headers parsed field by field</text>
    <text x="988" y="369" font-size="9" class="mono" fill="#7291a5">2 fixtures · classification</text>
  </g>

  <!-- runner -->
  <rect x="28" y="427" width="1224" height="98" rx="12" class="cardrect"/>
  <text x="46" y="454" font-size="14" font-weight="600">Mixed Traffic Simulation</text>
  <rect x="306" y="441" width="76" height="20" rx="10" fill="#0d1a26" stroke="#7ef29a"/>
  <text x="344" y="455" text-anchor="middle" font-size="9" class="green mono">playing</text>
  <text x="46" y="474" font-size="10" class="muted">All fixture families interleaved over a live-updating timeline</text>
  <rect x="720" y="441" width="94" height="30" rx="7" fill="#0d1a26" stroke="#1d3546"/>
  <text x="767" y="460" text-anchor="middle" font-size="10" class="muted mono">Speed 1×</text>
  <rect x="826" y="441" width="112" height="30" rx="7" fill="#122b35" stroke="#39d0d8"/>
  <text x="882" y="460" text-anchor="middle" font-size="10" class="teal">Start demo</text>
  <rect x="948" y="441" width="76" height="30" rx="7" fill="#102230" stroke="#1d3546"/>
  <text x="986" y="460" text-anchor="middle" font-size="10" class="muted">Pause</text>
  <rect x="1034" y="441" width="82" height="30" rx="7" fill="#102230" stroke="#1d3546"/>
  <text x="1075" y="460" text-anchor="middle" font-size="10" class="muted">Resume</text>
  <rect x="1126" y="441" width="62" height="30" rx="7" fill="#102230" stroke="#1d3546"/>
  <text x="1157" y="460" text-anchor="middle" font-size="10" class="muted">Reset</text>
  <rect x="1198" y="441" width="54" height="30" rx="7" fill="#102230" stroke="#ff6b6b" opacity="0.8"/>
  <text x="1225" y="460" text-anchor="middle" font-size="10" class="danger">Stop</text>
  <rect x="46" y="490" width="1196" height="6" rx="3" fill="#102230" stroke="#1d3546"/>
  <rect x="46" y="490" width="758" height="6" rx="3" fill="url(#bar)"/>
  <text x="46" y="512" font-size="9" class="muted mono">7 / 9 frames · 78% · 1× · playing</text>
  <text x="1238" y="512" text-anchor="end" font-size="9" class="muted">Sessions: Mixed Traffic · SOCKS5 Proxy Detection</text>

  <!-- stats -->
  <g>
    <rect x="28" y="541" width="188" height="72" rx="10" class="cardrect"/>
    <text x="42" y="561" font-size="8" class="caps">FRAMES</text>
    <text x="42" y="587" font-size="19" class="mono">7 / 9</text>
    <text x="42" y="601" font-size="8" class="muted">replayed through engine</text>
    <rect x="224" y="541" width="188" height="72" rx="10" class="cardrect"/>
    <text x="238" y="561" font-size="8" class="caps">PACKETS</text>
    <text x="238" y="587" font-size="19" class="mono">8</text>
    <text x="238" y="601" font-size="8" class="muted">3.2 KB processed</text>
    <rect x="420" y="541" width="188" height="72" rx="10" class="cardrect"/>
    <text x="434" y="561" font-size="8" class="caps">ACTIVE FLOWS</text>
    <text x="434" y="587" font-size="19" class="mono">7</text>
    <text x="434" y="601" font-size="8" class="muted">bounded flow table</text>
    <rect x="616" y="541" width="188" height="72" rx="10" class="cardrect"/>
    <text x="630" y="561" font-size="8" class="caps">DETECTION EVENTS</text>
    <text x="630" y="587" font-size="19" class="mono">6</text>
    <text x="630" y="601" font-size="8" class="muted">real classifier output</text>
    <rect x="812" y="541" width="188" height="72" rx="10" class="cardrect"/>
    <text x="826" y="561" font-size="8" class="caps">SIMULATED DROPS</text>
    <text x="826" y="587" font-size="19" class="mono warn">4</text>
    <text x="826" y="601" font-size="8" class="muted">verdicts never enforced</text>
    <rect x="1008" y="541" width="244" height="72" rx="10" class="cardrect"/>
    <text x="1022" y="561" font-size="8" class="caps">PROTOCOL DISTRIBUTION</text>
    <text x="1022" y="584" font-size="10" class="mono teal">tls 1 · dns 2 · http1 1</text>
    <text x="1022" y="599" font-size="10" class="mono danger">socks5 1 · connect 1 · vless 1</text>
  </g>

  <!-- chart -->
  <rect x="28" y="625" width="760" height="112" rx="12" class="cardrect"/>
  <text x="44" y="646" font-size="10" font-weight="700" letter-spacing="1.2" fill="#b9d1de">LIVE TRAFFIC RATES</text>
  <text x="772" y="646" text-anchor="end" font-size="8" class="muted">measured from demo engine</text>
  <line x1="58" y1="660" x2="772" y2="660" stroke="#1d3546"/>
  <line x1="58" y1="684" x2="772" y2="684" stroke="#1d3546"/>
  <line x1="58" y1="707" x2="772" y2="707" stroke="#1d3546"/>
  <path d="M58 718 L130 718 L130 700 L202 700 L202 712 L274 712 L274 688 L346 688 L346 706 L418 706 L418 677 L490 677 L490 694 L562 694 L562 665 L634 665 L634 699 L706 699 L706 714 L772 714 L772 718 Z" fill="url(#area)"/>
  <path d="M58 718 L130 718 L130 700 L202 700 L202 712 L274 712 L274 688 L346 688 L346 706 L418 706 L418 677 L490 677 L490 694 L562 694 L562 665 L634 665 L634 699 L706 699 L706 714 L772 714" fill="none" stroke="#39d0d8" stroke-width="2"/>
  <path d="M58 718 L130 718 L130 708 L202 708 L202 715 L274 715 L274 700 L346 700 L346 713 L418 713 L418 692 L490 692 L490 705 L562 705 L562 682 L634 682 L634 708 L706 708 L706 716 L772 716" fill="none" stroke="#7ef29a" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- events -->
  <rect x="800" y="625" width="452" height="112" rx="12" class="cardrect"/>
  <text x="816" y="646" font-size="10" font-weight="700" letter-spacing="1.2" fill="#b9d1de">DETECTION EVENTS</text>
  <line x1="816" y1="656" x2="1236" y2="656" stroke="#1d3546"/>
  <text x="816" y="673" font-size="8" class="caps">PROTOCOL</text>
  <text x="914" y="673" font-size="8" class="caps">CONFIDENCE</text>
  <text x="1010" y="673" font-size="8" class="caps">RULE</text>
  <text x="1180" y="673" font-size="8" class="caps">ACTION</text>
  <text x="816" y="691" font-size="9" class="mono danger">socks5</text>
  <text x="914" y="691" font-size="9" class="mono">97%</text>
  <text x="1010" y="691" font-size="8" class="mono muted">auto-block-proxy</text>
  <text x="1180" y="691" font-size="9" class="mono danger">drop*</text>
  <text x="816" y="708" font-size="9" class="mono danger">http-connect</text>
  <text x="914" y="708" font-size="9" class="mono">97%</text>
  <text x="1010" y="708" font-size="8" class="mono muted">auto-block-proxy</text>
  <text x="1180" y="708" font-size="9" class="mono danger">drop*</text>
  <text x="816" y="725" font-size="9" class="mono warn">dns</text>
  <text x="914" y="725" font-size="9" class="mono">97%</text>
  <text x="1010" y="725" font-size="8" class="mono muted">mixed-monitor-dns</text>
  <text x="1180" y="725" font-size="9" class="mono warn">monitor</text>

  <text x="28" y="753" font-size="8" class="muted">Illustrative UI preview. Actual values are derived from the embedded fixture replay at runtime; * drop verdicts are simulated and never enforced.</text>
</svg>
